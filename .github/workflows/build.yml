name: Build Revine (iOS 6 armv7 tweak)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The build only reads the repository; nothing here needs a write token.
permissions:
  contents: read

env:
  THEOS: /home/runner/theos
  MBEDTLS_VERSION: "3.6.7"
  # Theos + toolchain + the iOS 9.3 SDK (bump when any of them changes)
  THEOS_CACHE_KEY: theos-linux-clang11-sdk93-v1

jobs:
  build:
    name: ios6-armv7
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git libxml2 xz-utils libplist-utils libtinfo5 || \
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git libxml2 xz-utils libplist-utils

      - name: Restore Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: ${{ env.THEOS_CACHE_KEY }}

      - name: Install Theos, toolchain and the iOS 9.3 SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"

          echo "== toolchain =="
          curl -sSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            CLANG=$(find "$THEOS/toolchain" -type f -name clang -path '*/bin/*' | head -n1)
            echo "clang found at: $CLANG"
            ROOT=$(dirname "$(dirname "$CLANG")")
            mkdir -p "$THEOS/toolchain/linux"
            ln -sfn "$ROOT" "$THEOS/toolchain/linux/iphone"
          fi
          ls -la "$THEOS/toolchain/linux/iphone/bin" | head -n 40

          echo "== SDK =="
          RELEASE=$(curl -sS https://api.github.com/repos/theos/sdks/releases/latest)
          SDK=9.3
          SDK_URL=$(echo "$RELEASE" | grep -o "https://[^\"]*iPhoneOS${SDK}\.sdk[^\"]*" | head -n1 || true)
          echo "SDK $SDK asset: $SDK_URL"
          if [ -n "$SDK_URL" ]; then
            curl -sSL "$SDK_URL" -o /tmp/sdk.archive
            (tar -xJf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || tar -xzf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || unzip -q /tmp/sdk.archive -d "$THEOS/sdks/")
          fi
          if [ ! -d "$THEOS/sdks/iPhoneOS${SDK}.sdk" ]; then
            echo "Falling back to sparse checkout of theos/sdks for $SDK"
            rm -rf /tmp/sdks
            git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
            (cd /tmp/sdks && git sparse-checkout set "iPhoneOS${SDK}.sdk")
            mv "/tmp/sdks/iPhoneOS${SDK}.sdk" "$THEOS/sdks/"
          fi
          ls "$THEOS/sdks"

      - name: Fetch mbedTLS ${{ env.MBEDTLS_VERSION }}
        run: |
          set -e
          curl -sSL "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${MBEDTLS_VERSION}/mbedtls-${MBEDTLS_VERSION}.tar.bz2" -o /tmp/mbedtls.tar.bz2
          rm -rf vendor/mbedtls && mkdir -p vendor/mbedtls
          tar -xjf /tmp/mbedtls.tar.bz2 -C vendor/mbedtls --strip-components=1
          mv vendor/mbedtls/include/mbedtls/mbedtls_config.h vendor/mbedtls/include/mbedtls/mbedtls_config_default.h
          cp vendor/mbedtls_config_ios6.h vendor/mbedtls/include/mbedtls/mbedtls_config.h
          echo "mbedTLS sources: $(ls vendor/mbedtls/library/*.c | wc -l)"

      - name: CA bundle and license texts (installed with the tweak)
        run: |
          set -e
          SUPPORT="layout/Library/Application Support/Revine"
          curl -sSf https://curl.se/ca/cacert.pem -o "$SUPPORT/cacert.pem"
          grep -c "BEGIN CERTIFICATE" "$SUPPORT/cacert.pem"
          rm -rf "$SUPPORT/licenses" && mkdir -p "$SUPPORT/licenses"
          cp LICENSE "$SUPPORT/licenses/Revine-LICENSE.txt"
          cp THIRD-PARTY-NOTICES.md "$SUPPORT/licenses/THIRD-PARTY-NOTICES.txt"
          cp vendor/mbedtls/LICENSE "$SUPPORT/licenses/mbedtls-LICENSE.txt"
          ls -la "$SUPPORT" "$SUPPORT/licenses"

      - name: Patch the iOS 9.3 SDK (stub re-exported libraries missing from theos/sdks)
        run: |
          set -e
          # The toolchain's plistutil is linked against libplist-2.0.so.4, which Ubuntu 22.04 does not ship.
          TKIN="$THEOS/toolchain/linux/iphone/bin"
          if [ -x /usr/bin/plistutil ]; then
            ln -sf /usr/bin/plistutil "$TKIN/plistutil"
          fi
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          LIBSYS="$SDK/usr/lib/libSystem.tbd"
          test -f "$LIBSYS"
          for lib in $(grep -o "/usr/lib/system/lib[A-Za-z0-9_]*\.dylib" "$LIBSYS" | sort -u); do
            base="${lib%.dylib}"
            if [ ! -f "$SDK$base.tbd" ] && [ ! -f "$SDK$lib" ]; then
              mkdir -p "$(dirname "$SDK$base.tbd")"
              printf -- '---\narchs:           [ armv7, armv7s, arm64 ]\nplatform:        ios\ninstall-name:    %s\ncurrent-version: 1.0\ncompatibility-version: 1.0\nexports:\n  - archs:           [ armv7, armv7s, arm64 ]\n    symbols:         [ ]\n...\n' "$lib" > "$SDK$base.tbd"
              echo "stubbed $lib"
            fi
          done
          # The packaged libsystem_c.tbd lacks the plain libc string/memory symbols; libSystem provides them at runtime.
          LIBC="$SDK/usr/lib/system/libsystem_c.tbd"
          ADD=""
          for sym in _memcpy _memset _memmove _memcmp _memchr _strchr _strcmp _strncmp _strlen _strnlen _bzero \
                     _strcpy _strncpy _strcat _strlcpy _strlcat _strstr _strrchr _strdup _memset_s _memset_pattern4 \
                     _memset_pattern8 _memset_pattern16 _strncasecmp _strcasecmp; do
            if ! grep -Eq "[[ ,]${sym}[], ]" "$LIBC" "$SDK/usr/lib/system/libsystem_platform.tbd"; then
              ADD="${ADD}${sym}, "
            fi
          done
          if [ -n "$ADD" ]; then
            echo "adding to libsystem_c.tbd: $ADD"
            sed -i "0,/symbols:            \[ /s//symbols:            [ ${ADD}/" "$LIBC"
          fi

      - name: Syntax check (every error of our own sources in one go)
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          FLAGS="-target armv7-apple-ios6.0 -isysroot $SDK -fsyntax-only -w -ferror-limit=0 \
                 -Isrc -Isrc/Net -Ivendor -Ivendor/mbedtls/include -Ivendor/mbedtls/library"
          status=0
          for f in $(find src -name '*.m' | sort); do
            clang $FLAGS -fobjc-arc -x objective-c "$f" 2>&1 | grep -E 'error:' && status=1
          done
          if [ $status -ne 0 ]; then echo "SYNTAX CHECK FOUND ERRORS (see above)"; else echo "syntax check clean"; fi

      - name: Build
        run: |
          set -o pipefail
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 -j"$(nproc)" -k 2>&1 | tee build.log
          DYLIB=$(find .theos/_ -name Revine.dylib | head -n1)
          test -n "$DYLIB"
          echo "== staged tweak =="
          find .theos/_ -type f | sed 's/^/  /'
          otool -L "$DYLIB" 2>/dev/null || true
          ls -la packages/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Revine-packages
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
